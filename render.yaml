# Nexora AI — Render blueprint
services:
  - type: web
    name: nexora-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXORA_PUBLIC
        value: 1
      - key: NEXORA_TRUST_PROXY
        value: 1
      - key: PORT
        value: 10000
      # Render Free disk is not persistent: saved projects/chats survive page
      # reloads but are wiped on redeploy. The UI says so when this is set.
      - key: NEXORA_EPHEMERAL_DISK
        value: 1
      # Set ONE provider in the dashboard (env-managed; never written to disk):
      # - key: NEXORA_PROVIDER
      #   value: gemini
      # - key: NEXORA_MODEL
      #   value: gemini-flash-lite-latest
      # - key: NEXORA_GEMINI_KEY
      #   value: ...
      # Studio is a local-mode feature (stdio MCP needs the bridge); the hosted
      # copy stays Disconnected. See STUDIO-CONNECTION.md.
      # Studio: additionally lock tool calls behind a shared secret
      # - key: NEXORA_STUDIO_TOKEN
      #   value: replace-with-random-string
